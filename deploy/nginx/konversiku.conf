# KonversiKu: Nginx sebagai pintu masuk jaringan kampus (http://10.33.109.96), meneruskan ke
# API di 127.0.0.1:8000. Dipasang di /etc/nginx/sites-available/konversiku (situs "default"
# dinonaktifkan). HTTP dulu; HTTPS menyusul setelah keputusan domain (proyek 2).

# Rate limit per alamat IP: unggahan (POST /api/jobs) dan permintaan lain.
limit_req_zone $binary_remote_addr zone=konversiku_unggah:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=konversiku_umum:10m rate=20r/s;
limit_req_status 429;

# Websocket Grafana Live.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Batas aplikasi per format, terbesar 25 MiB (limits.MAX_UPLOAD_BYTES); kelonggaran 1 MiB agar
    # aplikasi yang memberi pesan 413 dengan nama format. Klien lewat VPN bisa lambat: 300 detik
    # adalah jeda maksimal antar-paket, bukan lama unggahan.
    client_max_body_size 26m;
    client_body_timeout 300s;

    # Pesan galat Nginx dalam bentuk JSON {"detail": ...} seperti API, agar UI bisa menampilkannya.
    error_page 413 = @terlalu_besar;
    error_page 429 = @terlalu_sering;
    error_page 502 503 504 = @tidak_tersedia;

    # Pemantauan hanya dari dalam VPS (Prometheus lokal), tidak untuk jaringan kampus.
    location = /metrics { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://127.0.0.1:8000; }
    location = /healthz { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://127.0.0.1:8000; }

    # Grafana: dasbor hanya-baca untuk jaringan. Halaman login diblokir dari jaringan; admin
    # login lewat tunnel SSH ke 127.0.0.1:3000 (login API basic auth dimatikan di Grafana).
    location = /grafana/login {
        allow 127.0.0.1; allow ::1; deny all;
        include /etc/nginx/konversiku-grafana.conf;
    }
    location /grafana/ {
        limit_req zone=konversiku_umum burst=40 nodelay;
        include /etc/nginx/konversiku-grafana.conf;
    }

    # Unggahan: batas ketat per IP.
    location = /api/jobs {
        limit_req zone=konversiku_unggah burst=20 nodelay;
        include /etc/nginx/konversiku-proxy.conf;
    }

    location / {
        limit_req zone=konversiku_umum burst=40 nodelay;
        include /etc/nginx/konversiku-proxy.conf;
    }

    location @terlalu_besar {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"detail": "File melebihi batas 25 MiB (26,2 MB), batas terbesar; tiap format punya batas sendiri, lihat Bantuan."}';
    }
    location @terlalu_sering {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 429 '{"detail": "Terlalu banyak permintaan dari alamat ini. Tunggu sebentar lalu coba lagi."}';
    }
    location @tidak_tersedia {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"detail": "Layanan sedang tidak tersedia. Coba lagi nanti."}';
    }
}
