# KonversiKu: /etc/systemd/system/grafana-server.service.d/konversiku.conf
# Grafana hanya di localhost; dibuka dari jaringan lewat Nginx di /grafana/.
# Dasbor bisa dilihat tanpa login (Viewer, hanya baca). Login lewat API (basic auth) dimatikan;
# halaman login diblokir dari jaringan oleh Nginx, sehingga admin hanya bisa login lewat tunnel SSH.
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_SERVER_ROOT_URL=http://10.33.109.96/grafana/
Environment=GF_SERVER_SERVE_FROM_SUB_PATH=true
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
Environment=GF_AUTH_BASIC_ENABLED=false
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/konversiku.json
