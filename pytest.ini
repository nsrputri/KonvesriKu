[pytest]
testpaths = tests
addopts = -ra
markers =
    e2e: uji browser nyata (Playwright + Chrome/Chromium)
    layanan: butuh PostgreSQL dan Redis
    proses: menjalankan proses uvicorn/Celery sungguhan
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
